# SPDX-License-Identifier: MIT
# Signed release of your launcher, so players' launchers update themselves. Run it by hand (Actions → release →
# Run workflow) after the one-time setup in README.md ("Signed updates"). The build job reads only; the sign job
# runs in your `launcher-release` environment, the only place the signing key exists. The release is a draft:
# try it on Windows, then publish it.
name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "update channel"
        required: true
        type: choice
        options: [stable, beta]
        default: stable
      expires_days:
        description: "days until the signed manifest expires (1-365)"
        required: true
        type: string
        default: "90"

permissions:
  contents: read

env:
  # Keep in step with build.yml. A commit, not a tag. a0debac5… = launcher-v0.2.0.
  LAUNCHER_REF: a0debac5fbe51732394d16cb23a71e1c221415c2

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeterna/nakara-oss
          ref: ${{ env.LAUNCHER_REF }}
          path: oss
          persist-credentials: false
      - name: Rust toolchain
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Check server.toml has updates set up
        working-directory: oss/launcher
        run: |
          cargo run --locked -q -p launcher-core --bin profile-check -- "$env:GITHUB_WORKSPACE/owner/server.toml" --root "$env:GITHUB_WORKSPACE/owner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toml = Get-Content -Raw "$env:GITHUB_WORKSPACE/owner/server.toml"
          if ($toml -notmatch '(?m)^\s*release_repo\s*=') { throw "server.toml has no release_repo: see README, Signed updates, step 3" }
          if ($toml -notmatch '(?m)^\s*update_keys\s*=\s*\[\s*"[0-9a-f]{64}"') { throw "server.toml has no update_keys: see README, Signed updates, step 3" }
      - name: Version
        id: meta
        working-directory: oss/launcher
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'launcher-ui' } | Select-Object -ExpandProperty version
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "launcher-ui version '$v' is not plain semver" }
          "version=$v" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT
      - name: Build
        working-directory: oss/launcher
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $env:AETERNA_LAUNCHER_PROFILE = "$env:GITHUB_WORKSPACE/owner/server.toml"
          cargo build --locked --release -p launcher-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/out" | Out-Null
          Copy-Item target/release/aeterna-launcher.exe "$env:GITHUB_WORKSPACE/out/aeterna-launcher.exe"
          Compress-Archive -Path target/release/aeterna-launcher.exe -DestinationPath "$env:GITHUB_WORKSPACE/out/aeterna-launcher-$env:VERSION-windows-x64.zip"
          $sums = @(Get-ChildItem "$env:GITHUB_WORKSPACE/out" -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name })
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/out/SHA256SUMS", (($sums -join "`n") + "`n"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: out/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: sign manifest + draft release
    needs: [build]
    runs-on: ubuntu-24.04
    environment: launcher-release
    permissions:
      contents: write   # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeterna/nakara-oss
          ref: ${{ env.LAUNCHER_REF }}
          path: oss
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: out/
      - name: Build launcher-sign
        working-directory: oss/launcher
        run: cargo build --locked --release -p launcher-sign
      # The key reaches the tool only through the environment; launcher-sign never prints it.
      - name: Check the key, write and sign the manifest
        env:
          LAUNCHER_SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          EXPIRES_DAYS: ${{ inputs.expires_days }}
        run: |
          set -euo pipefail
          if [ -z "$LAUNCHER_SIGNING_KEY" ]; then
            echo "No LAUNCHER_SIGNING_KEY secret in the launcher-release environment: see README, Signed updates, step 4"; exit 1
          fi
          case "$EXPIRES_DAYS" in ''|*[!0-9]*) echo "expires_days must be a number"; exit 1;; esac
          SIGN=oss/launcher/target/release/launcher-sign
          PUB=$("$SIGN" pubkey)
          echo "signing key (public): $PUB"
          grep -Eq "^update_keys *= *\[.*\"$PUB\"" owner/server.toml \
            || { echo "public key $PUB is not in server.toml update_keys: players' launchers would refuse this release"; exit 1; }
          "$SIGN" manifest --product aeterna-launcher --version "$VERSION" --channel "$CHANNEL" \
            --expires-days "$EXPIRES_DAYS" out/aeterna-launcher.exe "out/aeterna-launcher-$VERSION-windows-x64.zip" \
            > out/manifest.json
          "$SIGN" sign --manifest out/manifest.json --out out/manifest.json.sig
          ( cd out && sha256sum manifest.json manifest.json.sig >> SHA256SUMS )
          cat out/manifest.json
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v$VERSION-$(date -u +%Y%m%d%H%M)"
          printf 'Launcher built from aeterna/nakara-oss %s (MIT) with this repository'"'"'s server.toml.\nThis build is run by %s, not by the AETERNA project.\nCheck the files against SHA256SUMS.\n' \
            "$LAUNCHER_REF" "$REPO" > notes.md
          gh release create "$TAG" out/* --draft --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
